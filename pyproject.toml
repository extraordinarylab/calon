[project]
name = "calon"
version = "0.1.0"
description = "Calibrated zero-shot entity, relation, and event extraction"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "transformers>=5",
    "huggingface_hub",
    "safetensors",
    "pyarrow",
]

[project.optional-dependencies]
data = ["pandas", "datasets"]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E) and warnings (W), import sorting (I)
select = ["E", "F", "W", "I"]
ignore = [
    "E731",   # small lambdas assigned to names are used on purpose in helpers
    "E741",   # short math names (l for label vectors, as in the equations)
]

[tool.ruff.lint.per-file-ignores]
# LLM prompt templates are kept verbatim (changing them changes the generated data)
"src/calon/synth/*.py" = ["E501"]
"src/calon/eval/newtest.py" = ["E501"]
"src/calon/baselines/ee_baselines.py" = ["E501"]
"src/calon/baselines/llm_re_eval.py" = ["E501"]
"src/calon/baselines/llm_ner_eval.py" = ["E501"]
# report prose: each paragraph on one line so the rendered page has no stray line breaks
"src/calon/eval/report_html.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["calon"]

[tool.mypy]
python_version = "3.12"   # current numpy stubs use 3.12 syntax; the envs run 3.12
mypy_path = "src"
packages = ["calon"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
